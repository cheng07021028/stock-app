name: H195 consolidated public research
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - godpick_h211_counterevidence.py
      - godpick_h191_opportunity_engine.py
      - godpick_h193_joint_decision.py
      - godpick_h200_integrated.py
      - godpick_h195_command_center.py
      - godpick_h199_adaptive_weights.py
      - .github/workflows/h195_daily_command.yml
  schedule:
    - cron: '15 13 * * *' # 21:15 Taipei, same-day prospective evidence
    - cron: '55 15 * * *'
    - cron: '45 0 * * *'
permissions:
  contents: write
concurrency:
  group: h195-public-command-main
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pandas==2.3.3' 'numpy>=1.26,<3' 'requests>=2.31,<3' 'openpyxl>=3.1.2,<4'
      - run: python tools/h195_daily_command.py --out h195_output
      - name: Publish read-only research snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- data/h195/latest.json.gz
          if [ -d data/h211/daily ]; then git add -f -- data/h211/daily; fi
          if ! git diff --cached --quiet; then
            git commit -m 'data(H195): consolidated public research snapshot'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: H195-command-${{ github.run_id }}
          path: h195_output/
          retention-days: 90
      - name: Flag incomplete research data after publishing
        run: python -c "import json,sys; r=json.load(open('h195_output/health.json',encoding='utf-8')); sys.exit(2 if r['errors'] or not r['technical_current'] or r['status']!='RESEARCH_AVAILABLE' or r['health'].get('financial_errors') or r['health'].get('technical_status')!='CROSS_MARKET_RESEARCH_READY' else 0)"
