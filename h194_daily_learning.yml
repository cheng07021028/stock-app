name: H194 prospective research performance
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["H190 official full-market historical archive"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '15 12 * * *'
    - cron: '15 11 * * *' # 19:15: early same-day capture after official collection
    # Taiwan 22:55 and 23:45. Delayed execution after midnight must not backdate signals.
    - cron: '55 14 * * *'
    - cron: '45 15 * * *'
permissions:
  contents: write
concurrency:
  group: h194-public-performance-main
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.window.outputs.proceed }}
    steps:
      - id: window
        env:
          EVENT: ${{ github.event_name }}
        run: |
          t=$(TZ=Asia/Taipei date +%H%M)
          if [[ "$EVENT" != workflow_run || "$t" > 1814 ]]; then
            echo 'proceed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'proceed=false' >> "$GITHUB_OUTPUT"
          fi
  learn:
    needs: gate
    if: needs.gate.outputs.proceed == 'true' && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pandas==2.3.3' 'numpy>=1.26,<3' 'requests>=2.31,<3' 'openpyxl>=3.1.2,<4'
      - name: Capture and settle public research
        id: learning
        run: python tools/h194_daily_learning.py --out h194_output
      - name: Persist immutable public research ledger only
        if: always() && hashFiles('h194_output/health.json') != ''
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- data/h194/
          if ! git diff --cached --quiet; then
            git commit -m 'data(H194): prospective research signals and observed price outcomes'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Flag archive corruption after saving health
        if: steps.learning.outcome == 'success'
        run: python -c "import json,sys; sys.exit(2 if json.load(open('h194_output/health.json',encoding='utf-8'))['archive_errors'] else 0)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: H194-public-performance-${{ github.run_id }}
          path: h194_output/
          retention-days: 90
          if-no-files-found: warn
