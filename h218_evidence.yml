name: H218 prospective evidence acceptance
on:
  workflow_dispatch:
  schedule:
    - cron: '40 15 * * *' # 23:40 Taipei
    - cron: '15 0 * * *' # 08:15 Taipei
permissions:
  contents: read
concurrency:
  group: h218-evidence-main
  cancel-in-progress: false
jobs:
  acceptance:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pandas==2.3.3' 'numpy>=1.26,<3' 'requests>=2.31,<3' 'openpyxl>=3.1.2,<4'
      - run: python tools/h218_evidence.py --out h218_output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: H218-evidence-${{ github.run_id }}
          path: h218_output/
          retention-days: 90
          if-no-files-found: error
