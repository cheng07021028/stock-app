name: H219 first prospective performance review
on:
  workflow_dispatch:
  schedule:
    - cron: '45 15 * * *' # 23:45 Taipei
    - cron: '25 0 * * *' # 08:25 Taipei
permissions:
  contents: read
concurrency:
  group: h219-review-main
  cancel-in-progress: false
jobs:
  acceptance:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pandas==2.3.3' 'numpy>=1.26,<3' 'requests>=2.31,<3' 'openpyxl>=3.1.2,<4'
      - run: python tools/h219_review.py --out h219_output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: H219-review-${{ github.run_id }}
          path: h219_output/
          retention-days: 90
          if-no-files-found: error
