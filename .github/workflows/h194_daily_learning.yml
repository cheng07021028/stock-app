name: H194 prospective research performance
on:
  workflow_dispatch:
  schedule:
    # Taiwan 22:55 and 23:45. Delayed execution after midnight must not backdate signals.
    - cron: '55 14 * * *'
    - cron: '45 15 * * *'
permissions:
  contents: write
concurrency:
  group: h194-public-performance-main
  cancel-in-progress: false
jobs:
  learn:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pandas==2.3.3' 'numpy>=1.26,<3' 'requests>=2.31,<3' 'openpyxl>=3.1.2,<4'
      - name: Capture and settle public research
        id: learning
        run: python tools/h194_daily_learning.py --out h194_output
      - name: Persist immutable public research ledger only
        if: steps.learning.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- data/h194/
          if ! git diff --cached --quiet; then
            git commit -m 'data(H194): prospective research signals and observed price outcomes'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Flag archive corruption after saving health
        if: steps.learning.outcome == 'success'
        run: python -c "import json,sys; sys.exit(2 if json.load(open('h194_output/health.json',encoding='utf-8'))['archive_errors'] else 0)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: H194-public-performance-${{ github.run_id }}
          path: h194_output/
          retention-days: 90
          if-no-files-found: warn
