name: H169 official evidence contracts and necessary ZIP
on:
  push:
    branches:
      - fix/h169-evidence-contract
    paths:
      - "godpick_h114_parallel_alpha.py"
      - "godpick_h145_core_bridge.py"
      - "godpick_h1536_manager_clarity.py"
      - "godpick_h157_trader_audit.py"
      - "godpick_h169_pe_watch.py"
      - "tools/h169_refresh_pe_watch.py"
      - ".github/workflows/h169_official_pe_only.yml"
      - "tests/test_h169_evidence_contract.py"
      - "H169_README.txt"
      - ".github/workflows/h169_offline_regression.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal simulation requirements
        run: python -m pip install -q --disable-pip-version-check pytest pandas numpy openpyxl requests
      - name: Compile changed program code
        run: |
          python -m py_compile godpick_h114_parallel_alpha.py godpick_h145_core_bridge.py godpick_h1536_manager_clarity.py godpick_h157_trader_audit.py godpick_h169_pe_watch.py tools/h169_refresh_pe_watch.py tests/test_h169_evidence_contract.py
      - name: Simulate existing and new H145/H1532/H157/H164/H169
        run: |
          pytest -q tests/test_h169_evidence_contract.py tests/test_h145_candidate_bridge.py tests/test_h1532_prebreakout_scope.py tests/test_h157_trader_audit.py tests/test_h164_trader_focus.py
      - name: Build minimal patch (only production deltas plus tests and notes)
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,zipfile
          filenames=[
            "godpick_h114_parallel_alpha.py",
            "godpick_h145_core_bridge.py",
            "godpick_h157_trader_audit.py",
            "godpick_h169_pe_watch.py",
            "tools/h169_refresh_pe_watch.py",
            ".github/workflows/h169_official_pe_only.yml",
            "tests/test_h169_evidence_contract.py",
            "H169_README.txt",
          ]
          target=Path("StockApp_V191_H169_EvidenceContracts.zip")
          with zipfile.ZipFile(target,"w",zipfile.ZIP_DEFLATED,compresslevel=9) as z:
            for f in filenames:z.write(f,f)
          with zipfile.ZipFile(target) as z:
            assert z.namelist()==filenames
            assert z.testzip() is None
            assert all(z.read(f)==Path(f).read_bytes() for f in filenames)
          print("ZIP_BYTES=",target.stat().st_size)
          print("ZIP_SHA256=",hashlib.sha256(target.read_bytes()).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: StockApp_V191_H169_EvidenceContracts
          path: StockApp_V191_H169_EvidenceContracts.zip
          if-no-files-found: error
          retention-days: 7
