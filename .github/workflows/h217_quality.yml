name: H217 prospective quality closure
on:
  workflow_dispatch:
  schedule:
    - cron: '25 15 * * *' # 23:25 Taipei
    - cron: '35 23 * * *' # 07:35 Taipei: read-only if before capture window
permissions:
  contents: write
concurrency:
  group: h217-quality-main
  cancel-in-progress: false
jobs:
  quality:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pandas==2.3.3' 'numpy>=1.26,<3' 'requests>=2.31,<3' 'openpyxl>=3.1.2,<4'
      - name: Evaluate immutable research and same-session leader evidence
        run: python tools/h217_quality.py --capture --out h217_output
      - name: Preserve only public leader audits
        if: always() && hashFiles('h217_output/health.json') != ''
        run: |
          set -euo pipefail
          if [[ -d data/h217/daily ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -f -- data/h217/daily/
            if ! git diff --cached --quiet; then
              git commit -m 'data(H217): prospective research recall audit'
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: H217-quality-${{ github.run_id }}
          path: h217_output/
          retention-days: 90
          if-no-files-found: error
