name: H185 twelve analysts autonomous official research refresh
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'godpick_h185_auto_sources.py'
      - 'tools/h185_auto_collect.py'
      - '.github/workflows/h185_autonomous_research.yml'
  schedule:
    # UTC Mon-Fri 16:15 == Tue-Sat 00:15 Taiwan (after market-day H115/169/170).
    - cron: '15 16 * * 1-5'
permissions:
  contents: write
concurrency:
  group: h185-auto-research-main
  cancel-in-progress: false
jobs:
  update-official-research:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0
      - name: Read optional existing H150 public-headline cache
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: runtime-data
          path: runtime_h150
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded public-data dependencies
        run: python -m pip install 'requests>=2.31,<3' 'pandas==2.3.3' 'numpy>=1.26,<3'
      - name: Fetch all official TWSE and TPEx quotes and company announcements
        id: collector
        shell: bash
        run: |
          set -euo pipefail
          python tools/h185_auto_collect.py --h150-source runtime_h150/data/h150/H150_news.json
      - name: Commit only public H185 research snapshots and health
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [[ -d data/h185 ]]; then
            git add -f -- data/h185/
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'data(H185): autonomous official research evidence and health'
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo 'No new H185 research facts or health update.'
          fi
      - name: Fail when no new source can be checked, without losing old data
        if: steps.collector.outcome != 'success'
        run: |
          echo '::error::H185 did not confirm any official source. Previous research cache retained.'
          exit 1
