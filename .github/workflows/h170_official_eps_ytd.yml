name: H170 official cumulative EPS first-observed snapshot
on:
  workflow_dispatch:
  schedule:
    - cron: '15 14 * * 1-5'
permissions:
  contents: write
concurrency:
  group: h170-eps-first-observed-${{ github.ref }}
  cancel-in-progress: false
jobs:
  snapshot:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q requests
      - name: Record official financial statements EPS YTD (not TTM)
        run: python tools/h170_refresh_eps_ytd.py
      - name: Commit first-observed snapshot only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data/h115/eps_ytd_latest.json
          if git diff --cached --quiet; then
            echo "EPS snapshot unchanged"
          else
            git commit -m 'data(H170): official cumulative EPS YTD snapshot (not TTM)'
            git push
          fi
