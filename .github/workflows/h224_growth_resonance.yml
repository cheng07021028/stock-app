name: H224 growth resonance evidence review
on:
  workflow_dispatch:
  schedule:
    - cron: '55 14 * * 1-5' # 22:55 Taipei
    - cron: '45 0 * * *' # 08:45 Taipei read-only outside capture window
permissions:
  contents: write
concurrency:
  group: h224-growth-main
  cancel-in-progress: false
jobs:
  review:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pandas==2.3.3' 'numpy>=1.26,<3' 'requests>=2.31,<3' 'openpyxl>=3.1.2,<4' 'beautifulsoup4>=4.12,<5' 'lxml>=5.4,<7'
      - run: python tools/h224_review.py --out h224_output --capture
      - name: Persist immutable scenario evidence only
        if: always() && hashFiles('h224_output/health.json') != ''
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d data/h224/daily ]]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- data/h224/daily/
          if ! git diff --cached --quiet; then
            git commit -m 'data(H224): prospective growth scenario evidence'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: H224-review-${{ github.run_id }}
          path: h224_output/
          retention-days: 90
          if-no-files-found: error
