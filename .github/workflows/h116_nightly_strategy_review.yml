# Superseded by H117's single verified EOD + H116 evaluation pipeline.
# Keep manual dispatch for emergency read-only review; avoid dual schedulers/commit races.
name: H116 Manual Review (H117 Nightly Authority)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Evaluate locally (no commit)
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d data/h116/decisions && -s data/h116/verified_ohlc.csv && -s data/h116/benchmark_ohlc.csv ]]; then
            python tools/h116_closed_loop_cli.py review \
              --decisions data/h116/decisions \
              --prices data/h116/verified_ohlc.csv \
              --benchmark data/h116/benchmark_ohlc.csv \
              --out reports/h116 \
              --h118-strict
          else
            echo 'SKIP: verified official bars / immutable decisions are not ready.'
          fi
