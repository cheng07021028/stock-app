name: H116 Nightly Research Review (No Auto Trading)
on:
  workflow_dispatch:
  schedule:
    - cron: '30 11 * * 1-5' # 19:30 Asia/Taipei Mon-Fri; daylight-independent
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Evaluate ONLY if verified OHLC inputs exist
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -s data/h116/verified_ohlc.csv || ! -d data/h116/decisions ]]; then
            echo 'H116 SKIP: no verified daily OHLC / immutable snapshots. No synthetic return is produced.'
            exit 0
          fi
          if [[ ! -s data/h116/benchmark_ohlc.csv ]]; then
            echo 'H116 SKIP: no benchmark calendar; avoid fake T+n on halted stocks.'
            exit 0
          fi
          python tools/h116_closed_loop_cli.py review \
            --decisions data/h116/decisions \
            --prices data/h116/verified_ohlc.csv \
            --benchmark data/h116/benchmark_ohlc.csv \
            --out reports/h116
      - name: Commit derived reports only on genuine file changes
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f reports/h116/H116_strategy_summary.json ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add reports/h116/H116_strategy_summary.json reports/h116/H116_strategy_comparison.csv \
                    reports/h116/H116_T1_T3_T5_details.csv reports/h116/H116_approval_required.csv \
                    reports/h116/H116_source_manifest.json
            if ! git diff --cached --quiet; then
              git commit -m 'H116 verified research scorecard (proposal only)'
              git push
            fi
          fi
