name: V191 H32 return forecast

on:
  push:
    branches: [main]
    paths:
      - "godpick_return_forecast_engine.py"
      - "tools/apply_v191_h32_return_forecast_hotfix.py"
      - "tools/apply_v191_h32_return_forecast_hotfix_v2.py"
      - "tests/v191_hotfix32_return_forecast_smoke.py"
      - ".github/workflows/v191_h32_return_forecast.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  h32:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy pytest requests

      - name: Apply H32 integration patch
        run: python tools/apply_v191_h32_return_forecast_hotfix_v2.py

      - name: Compile H32 production files
        run: |
          python -m py_compile godpick_return_forecast_engine.py godpick_t1_trade_truth.py godpick_auto_update_tasks.py godpick_super_ai_excel_guide.py "pages/7_股神推薦.py"

      - name: Run H32 regression
        run: python -m pytest -q tests/v191_hotfix32_return_forecast_smoke.py

      - name: Commit production integration
        run: |
          if git diff --quiet; then
            echo "No H32 target diff to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "pages/7_股神推薦.py" godpick_auto_update_tasks.py godpick_t1_trade_truth.py godpick_super_ai_excel_guide.py
          git commit -m "V191-H32 integrate calibrated next-day and swing return forecasts"
          git push origin HEAD:main

      - name: Build H32 patch artifact
        run: |
          mkdir -p h32_patch/pages h32_patch/tools h32_patch/tests
          cp godpick_return_forecast_engine.py h32_patch/
          cp godpick_auto_update_tasks.py h32_patch/
          cp godpick_t1_trade_truth.py h32_patch/
          cp godpick_super_ai_excel_guide.py h32_patch/
          cp "pages/7_股神推薦.py" h32_patch/pages/
          cp tools/apply_v191_h32_return_forecast_hotfix_v2.py h32_patch/tools/
          cp tests/v191_hotfix32_return_forecast_smoke.py h32_patch/tests/
          cat > h32_patch/覆蓋說明.txt <<'EOF'
          V191-H32 個股隔日/波段報酬預測
          1. 不承諾90%點預測準確率。
          2. 輸出隔日預估漲跌幅、90%區間、5/10/20日預估報酬區間。
          3. 10日預估作為後續波段摘要。
          4. 90%指的是「預測區間歷史覆蓋目標」；方向命中率與MAE另外計算。
          5. 成熟樣本不足時會明確顯示未驗證，禁止宣稱90%準確。
          6. 修正T+1排程：將已救援的authority_rows直接傳入真相服務，避免校準永遠0樣本。
          7. 不修改Formal/A-、Entry、Risk、RR、流動性與資料新鮮度硬門檻。
          EOF

      - name: Upload H32 patch
        uses: actions/upload-artifact@v4
        with:
          name: stock-app-V191-H32-return-forecast-patch
          path: h32_patch
          retention-days: 14
