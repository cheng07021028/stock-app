name: V191 H27c scheduler heartbeat source deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v191_h27c_scheduler_source_deploy.yml"

permissions:
  contents: write

jobs:
  deploy-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply H27 production source patch
        run: |
          python tools/apply_v191_h27_scheduler_heartbeat_hotfix.py
          python tools/apply_v191_h27b_scheduler_verifier_scope_fix.py

      - name: Add deterministic H27 regression
        shell: bash
        run: |
          cat > tests/v191_hotfix27_scheduler_heartbeat_truth_smoke.py <<'PY'
          # -*- coding: utf-8 -*-
          from __future__ import annotations
          from datetime import datetime
          from pathlib import Path
          import sys

          ROOT = Path(__file__).resolve().parents[1]
          if str(ROOT) not in sys.path:
              sys.path.insert(0, str(ROOT))

          import godpick_auto_scheduler as scheduler
          import tools.verify_godpick_scheduler_remote_v191 as verifier

          def _enabled_cfg():
              cfg=scheduler.normalize_settings(scheduler.DEFAULT_SETTINGS)
              cfg['enabled']=True
              cfg['weekdays_only']=True
              return cfg

          def test_weekend_wakeup_persists_heartbeat(monkeypatch):
              calls=[]
              monkeypatch.setattr(scheduler,'load_settings',lambda:_enabled_cfg())
              monkeypatch.setattr(scheduler,'load_status',lambda:{})
              monkeypatch.setattr(scheduler,'load_history',lambda:[])
              monkeypatch.setattr(scheduler,'_persist_runtime',lambda p,x,r:(calls.append((p,dict(x),r)) or (True,'ok')))
              monkeypatch.setenv('GITHUB_RUN_ID','31849842924')
              monkeypatch.setenv('GITHUB_RUN_ATTEMPT','1')
              monkeypatch.setenv('GODPICK_WAKEUP_EVENT','schedule')
              res=scheduler.run_due_jobs(now=datetime(2026,8,15,7,17,tzinfo=scheduler.TZ))
              assert res['ok'] and res['skipped'] and '週末' in res['message']
              assert len(calls)==1
              payload=calls[0][1]
              assert payload['last_wakeup_at']=='2026-08-15 07:17:00'
              assert payload['last_wakeup_source']=='schedule'
              assert payload['last_wakeup_run_id']=='31849842924'
              assert payload['last_wakeup_result']=='SKIPPED_WEEKEND'

          def test_verifier_strict_only_when_central_workflow_opts_in(monkeypatch):
              stale={'last_wakeup_at':'2026-08-14 23:26:59','updated_at':'2026-08-14 23:26:59','last_wakeup_run_id':'old'}
              monkeypatch.setenv('GODPICK_EXPECTED_WAKEUP_RUN_ID','new')
              monkeypatch.setattr(verifier,'_read_local',lambda rel,default:dict(stale))
              monkeypatch.setattr(verifier,'_read_remote',lambda rel,default:(dict(stale),'ok'))
              ok,msg=verifier.verify_status()
              assert not ok and 'not current workflow' in msg

          def test_page17_weekend_truth_ui():
              src=(ROOT/'pages'/'17_系統健康檢查.py').read_text(encoding='utf-8')
              assert 'SKIPPED_WEEKEND' in src
              assert '這不是排程故障' in src
              assert 'last_wakeup_run_id' in src

          def test_central_workflow_current_run_contract():
              src=(ROOT/'.github'/'workflows'/'godpick_auto_scheduler_v191.yml').read_text(encoding='utf-8')
              assert 'GODPICK_EXPECTED_WAKEUP_RUN_ID' in src
              assert 'github.run_id' in src
          PY

      - name: Install focused dependencies
        run: python -m pip install -q pytest pandas requests streamlit

      - name: Compile H27 files
        run: python -m compileall -q godpick_auto_scheduler.py tools/verify_godpick_scheduler_remote_v191.py pages/17_系統健康檢查.py tools/apply_v191_h27_scheduler_heartbeat_hotfix.py tools/apply_v191_h27b_scheduler_verifier_scope_fix.py

      - name: Run scheduler regression suite
        run: |
          python -m pytest -q \
            tests/v191_hotfix10_unattended_scheduler_smoke.py \
            tests/v191_hotfix18_scheduler_stall_recovery_smoke.py \
            tests/v191_hotfix19_page17_autocatchup_live_status_smoke.py \
            tests/v191_hotfix27_scheduler_heartbeat_truth_smoke.py

      - name: Commit Python and Page17 production source only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add godpick_auto_scheduler.py tools/verify_godpick_scheduler_remote_v191.py pages/17_系統健康檢查.py tests/v191_hotfix27_scheduler_heartbeat_truth_smoke.py tools/apply_v191_h27_scheduler_heartbeat_hotfix.py tools/apply_v191_h27b_scheduler_verifier_scope_fix.py
          if git diff --cached --quiet; then
            echo 'No H27 source diff'
          else
            git commit -m 'V191-H27 persist every scheduler wake heartbeat truthfully'
            git push origin HEAD:main
          fi

      - name: Prepare downloadable H27 patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p patch/pages patch/tools patch/tests patch/.github/workflows
          cp godpick_auto_scheduler.py patch/
          cp godpick_scheduler_wakeup_service.py patch/
          cp tools/verify_godpick_scheduler_remote_v191.py patch/tools/
          cp tools/apply_v191_h27_scheduler_heartbeat_hotfix.py patch/tools/
          cp tools/apply_v191_h27b_scheduler_verifier_scope_fix.py patch/tools/
          cp 'pages/17_系統健康檢查.py' patch/pages/
          cp .github/workflows/godpick_auto_scheduler_v191.yml patch/.github/workflows/
          cp tests/v191_hotfix27_scheduler_heartbeat_truth_smoke.py patch/tests/
          cat > patch/覆蓋說明.txt <<'TXT'
          Stock App V191-H27｜中央自動排程 heartbeat 真實性修正

          已確認 GitHub 備援 schedule 實際有喚醒；舊版問題是週末提前 return 前未永久保存 heartbeat。
          修正後：
          1. 每次喚醒保存時間、來源、GitHub run_id、結果。
          2. 週末依 weekdays_only 跳過交易工作時仍更新 heartbeat。
          3. 中央 workflow verifier 必須驗證本次 github.run_id，不能拿舊 heartbeat 當成功。
          4. Page17 對週末正常跳過顯示綠色正常訊息，不再誤報失聯。
          5. 不修改任何選股、推薦、風控或資料門檻。
          TXT

      - name: Upload H27 patch
        uses: actions/upload-artifact@v4
        with:
          name: stock-app-V191-H27-scheduler-heartbeat-patch
          path: patch/
          retention-days: 7
