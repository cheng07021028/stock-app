name: H190 official full-market historical archive
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'godpick_h190_market_archive.py'
      - 'tools/h190_market_archive.py'
      - 'godpick_h212_data_recovery.py'
      - 'tools/h212_data_recovery.py'
      - 'godpick_h213_quality_gate.py'
      - 'tools/h213_quality.py'
      - '.github/workflows/h190_market_archive.yml'
  schedule:
    # Asia/Taipei 03:35, 09:35, 15:35, 21:35. Today's data only after 18:15.
    - cron: '35 1,7,13,19 * * *'
    # 18:25 / 19:45 Taipei: allow same-evening downstream capture.
    - cron: '25 10 * * *'
    - cron: '45 11 * * *'
permissions:
  contents: write
concurrency:
  group: h190-official-archive-main
  cancel-in-progress: false
jobs:
  archive:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public data dependencies
        run: python -m pip install 'requests>=2.31,<3' 'pandas>=2.2,<3'
      - name: Collect bounded batches and verify archive
        id: collect
        continue-on-error: true
        run: python tools/h190_market_archive.py collect --budget 24
      - name: H212 bounded individual gap recovery
        id: repair
        continue-on-error: true
        run: python tools/h212_data_recovery.py repair --budget 8
      - name: H213 bounded alternate official monthly evidence
        id: monthly
        continue-on-error: true
        run: python tools/h213_quality.py collect --budget 6
      - name: Persist only H190 public archive and health
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [[ -d data/h190 ]]; then git add -f -- data/h190/; fi
          if [[ -f data/h212/repair.json ]]; then git add -f -- data/h212/repair.json; fi
          if [[ -d data/h213 ]]; then git add -f -- data/h213/; fi
          if ! git diff --cached --quiet; then
            git commit -m 'data(H190): official date-batch history and coverage'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Verify published archive and warn on partial historical gaps
        env:
          COLLECT: ${{ steps.collect.outcome }}
          REPAIR: ${{ steps.repair.outcome }}
        run: |
          python tools/h190_market_archive.py inspect
          if [[ "$COLLECT" != success || "$REPAIR" != success ]]; then
            echo '::warning::H190/H212 partial source recovery; downstream must independently verify same-day evidence'
          fi
