name: Force auth indent fix v80
on:
  workflow_dispatch:
  push:
    paths:
      - 'fix_auth_indent_v80.py'
      - 'app_auth.py'
      - 'auth_config.json'
      - 'pages/15_帳號管理.py'
permissions:
  contents: write
jobs:
  patch-auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch all Streamlit pages safely
        run: python fix_auth_indent_v80.py
      - name: Verify auth guard
        run: python verify_auth_lock_v80.py
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Fix auth indentation and lock all pages v80"
          git push
