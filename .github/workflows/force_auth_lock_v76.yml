name: Force Streamlit auth lock v76

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'force_auth_lock_v76.py'
      - 'app_auth.py'
      - 'auth_config.json'
      - 'pages/15_帳號管理.py'
      - '.github/workflows/force_auth_lock_v76.yml'

permissions:
  contents: write

jobs:
  patch-auth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch all Streamlit pages with login guard
        run: python force_auth_lock_v76.py
      - name: Verify login guard
        run: python verify_auth_lock_v76.py
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py pages/*.py app_auth.py auth_config.json force_auth_lock_v76.py verify_auth_lock_v76.py
          git diff --cached --quiet && echo "No changes" || git commit -m "Force login guard on all Streamlit pages v76"
          git push
