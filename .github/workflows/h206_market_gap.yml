name: H206 public market strength reconciliation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - godpick_h206_market_gap.py
      - godpick_h208_recall_review.py
      - tools/h206_daily_review.py
      - .github/workflows/h206_market_gap.yml
  schedule:
    # Taiwan 00:25 and 09:15. No per-stock HTTP calls.
    - cron: '25 16 * * *'
    - cron: '15 1 * * *'
permissions:
  contents: write
concurrency:
  group: h206-public-market-gap-main
  cancel-in-progress: false
jobs:
  audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pandas==2.3.3' 'numpy>=1.26,<3' 'requests>=2.31,<3' 'openpyxl>=3.1.2,<4'
      - run: python tools/h206_daily_review.py --out h206_output
      - name: Publish only public market report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- data/h206/latest.json.gz
          if ! git diff --cached --quiet; then
            git commit -m 'data(H206): public market strength reconciliation'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: H206-review-${{ github.run_id }}
          path: h206_output/
          retention-days: 90
      - name: Flag incomplete market archive
        run: python -c "import json,sys; sys.exit(0 if json.load(open('h206_output/health.json',encoding='utf-8'))['status']=='MARKET_READY' else 2)"
      - name: H208 recall acceptance
        if: always()
        run: |
          python - <<'PY'
          import json, os, sys
          with open('h206_output/health.json', encoding='utf-8') as f:
              h = json.load(f).get('h208', {})
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('## H208 研究召回驗收\n')
              f.write('狀態：' + str(h.get('status', 'DATA_PENDING')) + '\n\n')
              f.write('候選數：' + str(h.get('candidate_count', 0)) + '\n\n')
              f.write('覆蓋：`' + json.dumps(h.get('coverage', {}), ensure_ascii=False) + '`\n\n')
              f.write('缺口：`' + json.dumps(h.get('errors', []), ensure_ascii=False) + '`\n')
          sys.exit(0 if h.get('status') == 'RESEARCH_READY' else 2)
          PY
