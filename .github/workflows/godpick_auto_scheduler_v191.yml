name: GodPick V191 Central Auto Scheduler

on:
  workflow_dispatch:
  schedule:
    # Wake the due-checker every 10 minutes. Actual task times are stored in
    # runtime-data and interpreted in Asia/Taipei; this cron does NOT hard-code
    # the user's business schedule.
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: godpick-v191-central-auto-scheduler
  cancel-in-progress: false

jobs:
  scheduler:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPO_OWNER: ${{ github.repository_owner }}
      GITHUB_REPO_NAME: ${{ github.event.repository.name }}
      GITHUB_REPO_BRANCH: runtime-data
      GITHUB_RUNTIME_DATA_BRANCH: runtime-data
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
      FINMIND_API_TOKEN: ${{ secrets.FINMIND_API_TOKEN }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
      FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
    steps:
      - name: Checkout main program
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore runtime-data authority before running
        shell: bash
        run: |
          git fetch origin runtime-data:refs/remotes/origin/runtime-data || true
          python tools/restore_runtime_data_v191.py

      - name: Run V191 due checker
        run: python tools/run_godpick_auto_scheduler_v191.py

      - name: Verify scheduler heartbeat/history reached runtime-data
        # Every scheduled task already persists its authority through the same
        # GitHub CAS / durability services used by Streamlit.  H10 deliberately
        # removes the old second bulk git-branch publish because it could fail on
        # untracked runtime files and could overwrite a newer concurrent authority.
        run: python tools/verify_godpick_scheduler_remote_v191.py
