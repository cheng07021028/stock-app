name: H193 public joint research
on:
  workflow_dispatch:
  schedule:
    - cron: '30 15 * * *'
permissions:
  contents: read
concurrency:
  group: h193-daily-review
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pandas==2.3.3' 'numpy>=1.26,<3' 'requests>=2.31,<3' 'openpyxl>=3.1.2,<4'
      - run: python tools/h193_daily_review.py --out h193_output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: H193-public-research-${{ github.run_id }}
          path: h193_output/
          retention-days: 90
          if-no-files-found: warn
