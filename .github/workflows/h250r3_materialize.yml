name: H250-R3 build actual R2 production overlay
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact production table dependency and test tools
        run: python -m pip install 'streamlit==1.59.2' 'starlette==1.3.1' 'pandas==2.3.3' pytest
      - name: Regress table boundary and R2 calculation
        run: python -m pytest -q tests/test_h250r3_table_guard.py tests/test_h250r3_overlay.py tests/test_h250r2.py test_h250r2_builder.py
      - name: Generate and verify actual changed source files
        run: |
          mkdir -p "$RUNNER_TEMP/h250r3"
          python tools/h250r3_build_overlay.py --out "$RUNNER_TEMP/h250r3/StockApp_V191_H250R2_Overlay.zip"
      - name: Downloadable production overlay (not deployed)
        uses: actions/upload-artifact@v4
        with:
          name: StockApp_V191_H250R2_Overlay
          path: ${{ runner.temp }}/h250r3/
          if-no-files-found: error
          retention-days: 7
