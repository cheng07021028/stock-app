name: V141 Update Official Factors Cache

on:
  # V191: automatic timing moved to godpick_auto_scheduler_v191.yml to avoid
  # duplicate official-factor updates. Keep this workflow for manual emergency use.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-official-factors:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update official factors cache
        run: python tools/update_official_factors_scheduled.py

      - name: Persist official factors to runtime-data branch
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # V186: business data must not be committed to main, otherwise every
          # scheduled data refresh redeploys Streamlit and can recreate stale
          # packaged JSON. Generate with main-branch code, then persist only the
          # resulting runtime artifacts to the dedicated runtime-data branch.
          mkdir -p /tmp/official-factor-v186
          cp official_factors_cache.json /tmp/official-factor-v186/official_factors_cache.json
          if [ -f official_factors_update_log.json ]; then
            cp official_factors_update_log.json /tmp/official-factor-v186/official_factors_update_log.json
          fi

          git reset --hard HEAD
          git fetch origin runtime-data
          git checkout -B runtime-data origin/runtime-data
          cp /tmp/official-factor-v186/official_factors_cache.json official_factors_cache.json
          if [ -f /tmp/official-factor-v186/official_factors_update_log.json ]; then
            cp /tmp/official-factor-v186/official_factors_update_log.json official_factors_update_log.json
          fi
          git add official_factors_cache.json official_factors_update_log.json || true
          if git diff --cached --quiet; then
            echo "No runtime official-factor changes to commit."
          else
            git commit -m "V186 persist scheduled official factors to runtime-data"
            git push origin runtime-data
          fi
