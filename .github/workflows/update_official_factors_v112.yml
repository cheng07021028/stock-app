name: V141 Update Official Factors Cache

on:
  workflow_dispatch:
  schedule:
    # Run every 30 minutes during Taiwan 21:00-23:30.
    # Taiwan UTC+8 => UTC 13:00-15:30.
    # The Python script reads data/config/official_factor_schedule_settings.json
    # and only updates when the configured time matches.
    - cron: "0,30 13-15 * * *"

permissions:
  contents: write

jobs:
  update-official-factors:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update official factors cache
        run: python tools/update_official_factors_scheduled.py

      - name: Commit official factors cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add official_factors_cache.json official_factors_update_log.json data/config/official_factor_schedule_settings.json || true
          if git diff --cached --quiet; then
            echo "No official factor cache changes to commit."
          else
            git commit -m "V141 scheduled update official factors cache"
            git push
          fi
