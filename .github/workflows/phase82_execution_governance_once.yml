name: Phase 8.2 execution governance upgrade

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/phase82_execution_governance_once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply verified Phase 8.2 patch
        shell: bash
        run: |
          cat > /tmp/phase82.patch.gz.b64 <<'B64'
[... ELLIPSIZATION ...]
B64
          base64 -d /tmp/phase82.patch.gz.b64 | gunzip > /tmp/phase82.patch
          git apply --check /tmp/phase82.patch
          git apply /tmp/phase82.patch

      - name: Compile and regression tests
        shell: bash
        run: |
          python -m compileall -q .
          python - <<'PY'
          import pandas as pd
          from godpick_formal_recommendation_engine import apply_formal_recommendation_engine
          from godpick_execution_governance import (
              canonicalize_final_partition,
              build_scan_quality_report,
              build_action_table,
              report_allows_formal_action,
          )

          hot = pd.DataFrame([{
              '股票代號':'6907','股票名稱':'過熱測試','推薦角色':'D｜過熱禁買','過熱原因':'近5日急漲',
              '推薦總分':92,'股神實戰總分':55,'買進分數':2.2,'Entry進場買點分':21.1,
              'Risk風控安全分':34.6,'風險報酬比':0.03,'追價風險分':78,'主流資金分':66.5,
              '族群攻擊強度':59.2,'成交額百萬':791.4,'最新價':195,'停損參考':128,'第一壓力價':197,
          }])
          hot_out = canonicalize_final_partition(apply_formal_recommendation_engine(hot))
          assert hot_out.iloc[0]['正式推薦分區'] == '正式排除清單'
          assert float(hot_out.iloc[0]['建議倉位上限%']) == 0.0
          assert float(hot_out.iloc[0]['實戰操作品質分']) < 30

          incomplete = build_scan_quality_report(
              {'total_count':1240,'analyzed_ok':1}, universe_size=1240,
              candidate_count=1, final_count=1,
          )
          assert not report_allows_formal_action(incomplete)

          good = pd.DataFrame([{
              '股票代號':'2330','股票名稱':'正式推薦測試','推薦角色':'A｜股神主推薦','推薦總分':86,
              '股神實戰總分':82,'買進分數':78,'Entry進場買點分':79,'Risk風控安全分':75,
              '風險報酬比':1.8,'追價風險分':38,'主流資金分':80,'族群攻擊強度':78,
              '成交額百萬':10000,'最新價':1000,'停損參考':930,'第一壓力價':1150,
              '爆發雷達分':76,'官方資料完整度':90,
          }])
          good_out = canonicalize_final_partition(apply_formal_recommendation_engine(good))
          assert good_out.iloc[0]['正式推薦分區'] == '正式下週主推薦'
          assert len(build_action_table(good_out)) == 1
          print('Phase 8.2 regression tests passed')
          PY

      - name: Commit verified upgrade and remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/phase82_execution_governance_once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add godpick_execution_governance.py godpick_formal_recommendation_engine.py godpick_column_schema.py godpick_signal_hub.py pages/7_股神推薦.py .github/workflows/phase82_execution_governance_once.yml
          git commit -m 'Phase 8.2: enforce scan completeness and practical execution governance'
          git push origin HEAD:main
