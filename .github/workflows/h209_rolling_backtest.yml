name: H209 prospective rolling backtest
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - godpick_h209_rolling_backtest.py
      - tools/h209_daily_backtest.py
      - .github/workflows/h209_rolling_backtest.yml
  schedule:
    # Taiwan 23:20 and 07:20. Never backdate recall signals after midnight.
    - cron: '20 15 * * *'
    - cron: '20 23 * * *'
permissions:
  contents: write
concurrency:
  group: h209-public-backtest-main
  cancel-in-progress: false
jobs:
  backtest:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pandas==2.3.3' 'numpy>=1.26,<3' 'requests>=2.31,<3' 'openpyxl>=3.1.2,<4'
      - run: python tools/h209_daily_backtest.py --out h209_output
      - name: Persist only H209 public research and corporate action evidence
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- data/h209/
          if ! git diff --cached --quiet; then
            git commit -m 'data(H209): rolling research and official action evidence'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: H209-backtest-${{ github.run_id }}
          path: h209_output/
          retention-days: 90
      - name: Report incomplete evidence after preserving data
        run: |
          python - <<'PY'
          import json,os
          h=json.load(open('h209_output/health.json',encoding='utf-8'))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f:
              for k in ('status','capture','signal_count','valid_rows','reasons','archive_errors','collector'):
                  f.write(str(k)+': '+str(h[k])+'\n\n')
          if h['status']=='DATA_PENDING' or h['archive_errors'] or h['collector'].get('errors'):
              print('::warning::H209 evidence incomplete; not a validated investment return')
          PY
