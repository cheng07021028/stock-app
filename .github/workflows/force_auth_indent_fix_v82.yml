name: Force auth indent fix v82

on:
  workflow_dispatch:
  push:
    paths:
      - "fix_auth_indent_v82.py"
      - "app_auth.py"
      - "auth_config.json"
      - "streamlit_app.py"
      - "pages/**.py"

permissions:
  contents: write

jobs:
  fix-auth-indent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run auth indent repair v82
        run: python fix_auth_indent_v82.py

      - name: Commit repaired files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py pages/*.py app_auth.py auth_config.json fix_auth_indent_v82.py || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Fix auth guard future imports and syntax v82"
            git push
          fi
