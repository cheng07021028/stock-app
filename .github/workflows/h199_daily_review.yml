name: H199 regime adaptive research weights
on:
  workflow_dispatch:
  schedule:
    # Taiwan 01:25; read committed H194 ledger, no source or trade writes.
    - cron: '25 17 * * *'
permissions:
  contents: read
concurrency:
  group: h199-strategy-readonly
  cancel-in-progress: false
jobs:
  review:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pandas==2.3.3' 'numpy>=1.26,<3' 'requests>=2.31,<3' 'openpyxl>=3.1.2,<4'
      - run: python tools/h199_daily_review.py --out h199_output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: H199-adaptive-review-${{ github.run_id }}
          path: h199_output/
          retention-days: 90
          if-no-files-found: warn
