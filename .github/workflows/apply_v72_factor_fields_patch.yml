name: Apply v72 factor fields patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-v72-factor-fields:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply v72 patch
        run: python apply_v72_factor_fields_patch.py

      - name: Verify syntax
        run: |
          python -m py_compile godpick_factor_schema.py
          python -m py_compile apply_v72_factor_fields_patch.py

      - name: Commit v72 factor fields
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add godpick_factor_schema.py apply_v72_factor_fields_patch.py pages/*.py godpick_record_service.py || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add v72 factor fields for calibration"
            git push
          fi
