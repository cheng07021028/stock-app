name: H137 audit live decisions and H136 sync
on:
  workflow_dispatch:
    inputs:
      market_closed:
        description: 'Manual override for an official market closure (does NOT mark sources verified)'
        type: boolean
        default: false
  schedule:
    - cron: '0 15 * * 1-5'  # 23:00 Asia/Taipei; after H136 22:30
permissions:
  contents: write
concurrency:
  group: h137-runtime-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: runtime-data
          path: runtime
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'pandas==2.3.3' 'numpy>=1.26,<3' 'requests>=2.31,<3'
      - name: Verify today's event-driven H126 archive and derived cache
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          FLAGS=()
          if [[ '${{ inputs.market_closed }}' == 'true' ]]; then FLAGS+=(--market-closed); fi
          python source/tools/h137_ops_audit.py --runtime-root runtime "${FLAGS[@]}"
      - name: Generate H138 manager research readiness brief
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python source/tools/h138_brief_cli.py --runtime-root runtime
      - name: Commit H137 audit receipt (no source or recommendation rewrites)
        if: always()
        shell: bash
        working-directory: runtime
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [[ -f data/h137/H137_audit.json || -f data/h138/H138_manager_brief.json ]]; then
            if [[ -f data/h137/H137_audit.json ]]; then git add -f data/h137/H137_audit.json; fi
          if [[ -f data/h138/H138_manager_brief.json ]]; then
            git add -f data/h138/H138_manager_brief.json
          fi
            if ! git diff --cached --quiet; then
              git commit -m 'H137: audit H126 decision and H136 cache status'
              git pull --rebase origin runtime-data
              git push origin HEAD:runtime-data
            fi
          fi
      - name: Surface blocked pipeline clearly
        if: steps.verify.outcome != 'success'
        shell: bash
        run: |
          echo 'H137 audit requires attention: check runtime/data/h137/H137_audit.json and H136 workflow.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
