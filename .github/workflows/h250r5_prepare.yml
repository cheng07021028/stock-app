name: H250-R5 prepare actual manual execution patch
run-name: H250-R5 prepare patch (no automatic deployment)
on:
  workflow_dispatch:
    inputs:
      publish_review_branch:
        description: 'Try publishing a review branch; never merge to main'
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: h250r5-source-prepare
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test-only dependency
        run: python -m pip install 'requests>=2.31,<3' 'PyYAML>=6,<7'
      - name: Materialize exact source, test and stage only modified files
        env:
          PYTHONUTF8: '1'
        run: |
          git switch -c "h250r5-upgrade-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python APPLY_H250R5.py "$GITHUB_WORKSPACE" --apply --stage --out "$RUNNER_TEMP/StockApp_V191_H250R5_Overlay.zip"
          python -c "import yaml; d=yaml.safe_load(open('.github/workflows/godpick_auto_scheduler_v191.yml',encoding='utf-8')); assert 'jobs' in d and ('on' in d or True in d)"
          git diff --cached --check
          git diff --cached --stat
      - name: Upload actual changed production files
        uses: actions/upload-artifact@v4
        with:
          name: StockApp_V191_H250R5_Overlay
          path: ${{ runner.temp }}/StockApp_V191_H250R5_Overlay.zip
          if-no-files-found: error
          retention-days: 14
      - name: Publish review branch (never push main or runtime-data)
        if: ${{ inputs.publish_review_branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'H250-R5 exact enabled manual execution and receipt verification'
          BRANCH="h250r5-upgrade-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if ! git push origin "HEAD:refs/heads/${BRANCH}"; then
            echo "::warning::Review branch push was rejected; download the already uploaded Overlay artifact and manually apply the actual files. No deployment occurred."
            echo "## Source preparation PASS; branch publication BLOCKED" >> "$GITHUB_STEP_SUMMARY"
            echo "Download StockApp_V191_H250R5_Overlay and upload the actual files to main. No deployment occurred." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "## H250-R5 source preparation PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "Review the actual patch and merge it manually: https://github.com/${GITHUB_REPOSITORY}/compare/main...${BRANCH}?expand=1" >> "$GITHUB_STEP_SUMMARY"
          echo "No runtime data was changed and no production jobs were started." >> "$GITHUB_STEP_SUMMARY"
